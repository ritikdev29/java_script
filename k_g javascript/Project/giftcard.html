<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Gift Card 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .gift-card {
            background: linear-gradient(145deg, #fff, #f8f8f8);
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 
                0 20px 40px rgba(255, 107, 107, 0.3),
                0 10px 20px rgba(255, 107, 107, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            overflow: hidden;
        }

        .gift-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 30px 60px rgba(255, 107, 107, 0.4),
                0 15px 30px rgba(255, 107, 107, 0.3);
        }

        .gift-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .gift-card:hover::before {
            left: 100%;
        }

        .heart-decoration {
            position: absolute;
            font-size: 24px;
            color: #ff6b9d;
            animation: float 6s ease-in-out infinite;
        }

        .heart-decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .heart-decoration:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
        .heart-decoration:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 2s; }
        .heart-decoration:nth-child(4) { top: 60%; right: 10%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .ribbon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
            z-index: 10;
        }

        .title {
            font-size: 32px;
            color: #c44569;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .message {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .amount {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .from-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ff9a9e;
        }

        .from {
            font-size: 18px;
            color: #666;
            font-style: italic;
        }

        .customize-panel {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .customize-panel h3 {
            color: #c44569;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff9a9e;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c44569;
        }

        .generate-btn {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 157, 0.5);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff6b9d;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 4s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .gift-card {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .title {
                font-size: 26px;
            }
            
            .amount {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="gift-card" id="giftCard">
            <div class="ribbon">💝 LOVE GIFT CARD 💝</div>
            <div class="heart-decoration">💖</div>
            <div class="heart-decoration">💕</div>
            <div class="heart-decoration">💗</div>
            <div class="heart-decoration">💝</div>
            
            <div class="title">Special Love Gift</div>
            <div class="message" id="message">
                You mean the world to me! This gift is from my heart to yours 💕
            </div>
            <div class="amount" id="amount">$100</div>
            
            <div class="from-section">
                <div class="from" id="from">
                    With all my love, <span id="sender">Your Secret Admirer</span>
                </div>
            </div>
        </div>

        <div class="customize-panel">
            <h3>✨ Customize Your Love Gift Card</h3>
            <div class="input-group">
                <label>Amount ($)</label>
                <input type="text" id="amountInput" value="100" placeholder="e.g., 100">
            </div>
            <div class="input-group">
                <label>Message</label>
                <textarea id="messageInput" rows="3" placeholder="Enter your loving message...">You mean the world to me! This gift is from my heart to yours 💕</textarea>
            </div>
            <div class="input-group">
                <label>From</label>
                <input type="text" id="senderInput" value="Your Secret Admirer" placeholder="Your name">
            </div>
            <button class="generate-btn" onclick="updateCard()">Generate Love Card 💖</button>
            <br><br>
            <button class="generate-btn" onclick="printCard()" style="background: linear-gradient(45deg, #4ecdc4, #44a08d);">Print/Download 🖨️</button>
        </div>
    </div>

    <script>
        // Update gift card content
        function updateCard() {
            const amount = document.getElementById('amountInput').value;
            const message = document.getElementById('messageInput').value;
            const sender = document.getElementById('senderInput').value;
            
            document.getElementById('amount').textContent = `$${amount}`;
            document.getElementById('message').textContent = message;
            document.getElementById('sender').textContent = sender;
            
            // Trigger animation
            const card = document.getElementById('giftCard');
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
                card.style.transform = 'translateY(0) scale(1)';
            }, 150);
            
            createParticles();
        }

        // Create floating particles animation
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    createParticle(particlesContainer);
                }, i * 100);
            }
        }

        function createParticle(container) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 5000);
        }
