  <script>
    // Create a method to check a number is odd or even
    function isOdd(number) {
      let rem = number % 2;
      let isOdd = rem == 1; // rem = reminder...
      return isOdd;
    }
    console.log(isOdd(4));  // not odd so. false
     console.log(isOdd(5));  // true because even....
     console.log(isOdd(0));  // false because even
     console.log(isOdd(99));

    // Create a method to return larger of the two nu...
    function larger(num1, num2) {
       /*if (num1 > num2) {
         return num1;
       } else {
         return num2;
       }*/
      return num1 > num2 ? num1 : num2; // ternary ka use hua hai .. this is one line statement they are perfomed the task , comment if to return num2;
    }
    console.log(larger(4, 5));
     console.log(larger(5, 5));
     console.log(larger(566, 765));


    // Create Method to convert Celsius to Fahrenheit (F = (9/5) * C + 3)
    function toFahrenheit(celsiusValue) {
      return 9/5*celsiusValue + 32; // these is single line function write the code....
    }

    console.log(toFahrenheit(38));
    console.log(toFahrenheit(0));
    console.log(toFahrenheit(100));
